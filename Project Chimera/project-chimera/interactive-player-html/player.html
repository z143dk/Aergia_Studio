<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Player - Project Chimera</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .player-container {
            position: relative;
            width: 90%;
            max-width: 1280px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
            border-radius: 8px;
        }
        .choice-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            color: white;
            padding: 30px;
            text-align: center;
            display: none; /* Hidden by default */
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        .choice-overlay h3 {
            margin-top: 0;
            font-size: 1.5rem;
        }
        .choice-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .choice-btn {
            padding: 12px 25px;
            border: 2px solid white;
            background-color: transparent;
            color: white;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .choice-btn:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <video id="interactive-video" controls></video>
        <div id="choice-overlay" class="choice-overlay">
            <h3 id="choice-question"></h3>
            <div id="choice-buttons" class="choice-buttons">
                <!-- Buttons will be added here by JavaScript -->
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/InteractionPlayer.js') }}"></script>
</body>
</html>
