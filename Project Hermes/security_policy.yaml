# Hermes Scoped Allowlists and Redaction Policy

version: "hermes-0.13"

redaction:
  # The default behavior is to scrub any regex matching API key formats
  default: true
  patterns:
    - name: "Schwab API Key"
      regex: '(?i)schwab[_\-]?key[=\s]*([a-zA-Z0-9]{32,})'
      replace_with: "[REDACTED_SCHWAB_KEY]"
    - name: "Coinbase API Key"
      regex: '(?i)coinbase[_\-]?key[=\s]*([a-zA-Z0-9]{32,})'
      replace_with: "[REDACTED_COINBASE_KEY]"
    - name: "Anthropic/OpenAI Keys"
      regex: '(sk-ant-api03-[a-zA-Z0-9\-_]{93}|sk-[a-zA-Z0-9]{48})'
      replace_with: "[REDACTED_LLM_KEY]"

allowlists:
  # Only specific local tools are allowed to access the raw secrets
  midas_execution_agent:
    tools: ["execute_trade", "get_account_balance"]
    can_access_secrets: true
  
  ares_forensics_agent:
    tools: ["analyze_pcap", "extract_strings"]
    can_access_secrets: false

  aergia_core_router:
    tools: ["send_notification", "move_avatar", "speak"]
    can_access_secrets: false
